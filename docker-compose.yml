services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment: {OLLAMA_BASE_URL: "http://ollama:11434"}
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]   # then: docker compose exec ollama ollama pull llama3.1:8b
  prometheus:
    image: prom/prometheus
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards
volumes: {ollama: {}}
